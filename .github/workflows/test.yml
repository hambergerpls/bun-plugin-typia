name: Test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: typia ${{ matrix.typia }} / TypeScript ${{ matrix.typescript }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { typia: '5.5.4', typescript: '5.0.4' }
          - { typia: '6.12.2', typescript: '5.6.3' }
          - { typia: '7.6.4', typescript: '5.7.3' }
          - { typia: '8.2.0', typescript: '5.8.3' }
          - { typia: '9.7.2', typescript: '5.9.3' }
          - { typia: '10.1.0', typescript: '5.9.3' }
          - { typia: '11.0.3', typescript: '5.9.3' }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - name: Pin typia and TypeScript
        env:
          TYPIA: ${{ matrix.typia }}
          TYPESCRIPT: ${{ matrix.typescript }}
        run: |
          bun -e '
            const p = await Bun.file("package.json").json();
            p.devDependencies.typia = process.env.TYPIA;
            p.devDependencies.typescript = process.env.TYPESCRIPT;
            await Bun.write("package.json", JSON.stringify(p, null, 2));
          '
          rm -f bun.lockb bun.lock

      - name: Install Dependencies
        run: bun install

      - name: Run tests
        run: bun test
