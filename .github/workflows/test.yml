name: Test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: typia ${{ matrix.typia }} / TypeScript ${{ matrix.typescript }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { typia: '13.1.19', typescript: '7.0.2' }
          - { typia: '14.0.6', typescript: '7.0.2' }
          - { typia: '15.0.0', typescript: '7.0.2' }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # ttsc needs Node.js 22.15 or later.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: oven-sh/setup-bun@v2

      - name: Pin typia and TypeScript
        env:
          TYPIA: ${{ matrix.typia }}
          TYPESCRIPT: ${{ matrix.typescript }}
        run: |
          # Use node, not bun: bunfig.toml preloads the plugin, which would
          # import typia before it is installed.
          node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
            p.devDependencies.typia = process.env.TYPIA;
            p.devDependencies.typescript = process.env.TYPESCRIPT;
            fs.writeFileSync("package.json", JSON.stringify(p, null, 2));
          '
          rm -f bun.lockb bun.lock

      - name: Install Dependencies
        run: bun install

      - name: Run tests
        run: bun test

  smoke:
    name: Packed install / typia ${{ matrix.typia }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        typia: ['13.1.19', '14.0.6', '15.0.0']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: oven-sh/setup-bun@v2

      - name: Install the packed plugin in a clean project and run it
        env:
          TYPIA: ${{ matrix.typia }}
          TYPESCRIPT: '7.0.2'
        run: scripts/smoke-pack.sh
